name: Release packages

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (downloads only; does not publish a release)"
        type: string
        default: "master"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.release.tag_name || github.ref }}
          fetch-depth: 0

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gettext libglib2.0-bin make dpkg-dev python3

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Validate source and packaging
        run: |
          for source in src/*.js; do
            node --check "$source"
          done
          glib-compile-schemas --strict --dry-run schemas
          python3 -m unittest discover -s tests -p '*test.py'

      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          python3 <<'PY'
          import json
          import os
          metadata = json.load(open('metadata.json'))
          version = metadata['version-name'].replace(' ', '-')
          tag = os.environ['RELEASE_TAG']
          if tag and tag != f'v{version}':
              raise SystemExit(f'Release tag {tag} must match metadata.json (v{version}).')
          PY

      - name: Build installable packages
        run: make release

      - name: Verify package checksums
        run: cd dist && sha256sum -c SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: dash-to-panel-release-packages
          path: dist/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref_type == 'tag')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dash-to-panel-release-packages
          path: dist

      - name: Attach packages to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            extra=()
            if [[ "$RELEASE_TAG" == *-* ]]; then
              extra+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" dist/* --verify-tag \
              --title "Dash to Panel $RELEASE_TAG" --generate-notes "${extra[@]}"
          fi
